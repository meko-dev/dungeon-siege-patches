name: Build mod package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Build loader and native mods
        shell: cmd
        run: build.cmd

      - name: Prepare anti-aliasing dependencies
        shell: pwsh
        run: ./antialias_mod/build.ps1

      - name: Assemble flat package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'dungeon-siege-mods'
          New-Item -ItemType Directory -Path $package | Out-Null
          $sources = @(
            'antialias_mod/build/D3DImm.dll'
            'antialias_mod/build/DDraw.dll'
            'antialias_mod/dgVoodoo.conf'
            'damage_numbers_mod/build/ds_damage_numbers.dll'
            'resolution_mod/build/ds_resolution.dll'
            'mod_loader/build/version.dll'
          )
          foreach ($source in $sources) {
            Copy-Item -LiteralPath $source -Destination $package
          }
          $expected = @('D3DImm.dll', 'DDraw.dll', 'dgVoodoo.conf', 'ds_damage_numbers.dll', 'ds_resolution.dll', 'version.dll')
          $actual = @(Get-ChildItem -LiteralPath $package -File | Select-Object -ExpandProperty Name)
          if ((Compare-Object $expected $actual) -or $actual.Count -ne 6) {
            throw 'Package must contain exactly the six required files.'
          }
          foreach ($file in Get-ChildItem -LiteralPath $package -File) {
            if ($file.Length -eq 0) { throw "Empty package file: $($file.Name)" }
          }
          "MOD_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # GitHub wraps these files in one downloadable ZIP. Upload the files
      # directly so users get six root-level files, not a ZIP inside a ZIP.
      - name: Upload install-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-siege-mods
          path: ${{ env.MOD_PACKAGE }}/*
          if-no-files-found: error
          retention-days: 30
